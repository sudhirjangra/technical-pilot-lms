packages:
  - apps/*
  - packages/*
overrides:
  # Force a single fastify instance; @nestjs/platform-fastify pins 5.11.x which
  # otherwise conflicts with the direct 5.12.x dependency and breaks plugin types.
  fastify: ^5.12.1
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - unrs-resolver
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - nestjs-pino
  - sharp
